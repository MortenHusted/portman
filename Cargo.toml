[workspace]
resolver = "2"
members = [
    "crates/portman-core",
    "crates/portman-daemon",
    "crates/portman-cli",
    "crates/portman-protocol",
    "crates/portman-netbridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MortenHusted/portman"
homepage = "https://github.com/MortenHusted/portman"
rust-version = "1.78"

[workspace.dependencies]
portman-core = { path = "crates/portman-core" }
portman-netbridge = { path = "crates/portman-netbridge" }
portman-protocol = { path = "crates/portman-protocol" }
portman-daemon = { path = "crates/portman-daemon" }

anyhow = "1"
base64 = "0.22"
bollard = "0.19"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
futures-util = "0.3"
crossterm = { version = "0.28", features = ["event-stream"] }
httparse = "1.9"
ratatui = "0.29"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "1"
dotenvy = "0.15"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
